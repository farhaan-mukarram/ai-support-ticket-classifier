[project]
name = "llm-intent-classification"
version = "0.1.0"
description = "LLM powered intent classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.0.1",
    "jupyterlab>=4.6.3",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "torch>=2.11.0",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
flash-attn = ["packaging", { requirement = "torch", match-runtime = true }]
